name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.sum
            cli/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l core cli)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Build (cli)
        working-directory: ./cli
        run: go build -o leafpress ./cmd/leafpress

      - name: Vet (core)
        working-directory: ./core
        run: go vet ./...

      - name: Vet (cli)
        working-directory: ./cli
        run: go vet ./...

      - name: Unit tests with coverage (core)
        working-directory: ./core
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Unit tests with coverage (cli)
        working-directory: ./cli
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Run tests
        working-directory: ./cli
        run: ./test.sh

      - name: Validate benchmark workloads
        env:
          LEAFPRESS_BIN: ${{ github.workspace }}/cli/leafpress
        run: ./benchmark/test.sh

      - name: Verify website cache headers
        run: bash tests/website-cache.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            core/coverage.out
            cli/coverage.out

  cli-standalone:
    name: CLI standalone module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: cli/go.sum

      - name: Verify published CLI module has no local replacements
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' cli/go.mod; then
            echo "cli/go.mod must not contain replace directives; use go.work for local modules"
            exit 1
          fi

      - name: Verify CLI module outside the workspace
        working-directory: ./cli
        env:
          GOWORK: "off"
        run: go test -mod=readonly ./...

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.sum
            cli/go.sum

      - name: Install govulncheck
        env:
          # The latest scanner may require a newer Go than the project.
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check vulnerabilities (core)
        working-directory: ./core
        run: govulncheck ./...

      - name: Check vulnerabilities (cli standalone)
        working-directory: ./cli
        run: GOWORK=off govulncheck ./...

  native-smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: cli/go.sum
      # Keep expensive suites on Linux; exercise actual OS filesystem,
      # running-executable replacement, and watcher behavior here.
      - name: Test native CLI behavior outside the workspace
        working-directory: cli
        env:
          GOWORK: "off"
        run: >-
          go test -mod=readonly -timeout=5m
          ./cmd/leafpress ./internal/cli ./internal/build ./internal/server
          -run 'TestNative|TestReplaceExecutable|TestExtractBinary|TestBuildRejectsUnsafe|TestBuildRefuses|TestFailedFullBuild|TestPromotionFailure|TestIncremental|TestFilenamesWithSpaces|TestStaticHandler|TestAddWatchDirs|TestDefaultHost|TestDisplayURL|TestRunNew'

  browser-smoke:
    name: Reader smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise essential reader flows
        env:
          LEAFPRESS_CONFORMANCE_BROWSER: ${{ matrix.browser }}
        run: npm run test:themes -- browser-smoke.spec.js
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-smoke-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  theme-conformance:
    name: Theme conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            core/go.sum
            cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cross-theme conformance suite
        run: npm run test:themes

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: theme-conformance-report
          path: playwright-report/
          retention-days: 14
