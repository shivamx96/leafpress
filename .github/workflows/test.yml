name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify published CLI module has no local replacements
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' cli/go.mod; then
            echo "cli/go.mod must not contain replace directives; use go.work for local modules"
            exit 1
          fi

      - name: Build (cli)
        working-directory: ./cli
        run: go build -o leafpress ./cmd/leafpress

      - name: Unit tests (core)
        working-directory: ./core
        run: go test ./...

      - name: Unit tests (cli)
        working-directory: ./cli
        run: go test ./...

      - name: Run tests
        working-directory: ./cli
        run: ./test.sh
