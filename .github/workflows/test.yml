name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l core cli)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Verify published CLI module has no local replacements
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' cli/go.mod; then
            echo "cli/go.mod must not contain replace directives; use go.work for local modules"
            exit 1
          fi

      - name: Verify CLI module outside the workspace
        working-directory: ./cli
        env:
          GOWORK: "off"
        run: go test -mod=readonly ./...

      - name: Build (cli)
        working-directory: ./cli
        run: go build -o leafpress ./cmd/leafpress

      - name: Vet (core)
        working-directory: ./core
        run: go vet ./...

      - name: Vet (cli)
        working-directory: ./cli
        run: go vet ./...

      - name: Unit tests with coverage (core)
        working-directory: ./core
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Unit tests with coverage (cli)
        working-directory: ./cli
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Run tests
        working-directory: ./cli
        run: ./test.sh

      - name: Validate benchmark workloads
        env:
          LEAFPRESS_BIN: ${{ github.workspace }}/cli/leafpress
        run: ./benchmark/test.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            core/coverage.out
            cli/coverage.out
