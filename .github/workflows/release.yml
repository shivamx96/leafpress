name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # This repository contains two Go modules. Their scoped tags must point
      # at the same commit as the product release tag or `go install @latest`
      # can select source/config versions that were never tested together.
      - name: Verify module tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          test "$(git rev-list -n 1 "core/${VERSION}")" = "${GITHUB_SHA}"
          test "$(git rev-list -n 1 "cli/${VERSION}")" = "${GITHUB_SHA}"

      # The tag checks above establish that both published modules are the
      # exact source being released. Fetch directly from GitHub here so Go's
      # public proxy/checksum propagation cannot make a valid release flaky.
      - name: Verify Go install from release tags
        env:
          VERSION: ${{ github.ref_name }}
          GOBIN: ${{ runner.temp }}/leafpress-go-install
          GOWORK: "off"
          GOPROXY: "direct"
          GOSUMDB: "off"
        run: |
          go install "github.com/shivamx96/leafpress/cli/cmd/leafpress@${VERSION}"
          go install github.com/shivamx96/leafpress/cli/cmd/leafpress@latest
          test "$("${GOBIN}/leafpress" version)" = "leafpress ${VERSION}"

  build:
    needs: verify-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd cli
          BINARY_NAME="leafpress"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="leafpress.exe"
          fi
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o $BINARY_NAME ./cmd/leafpress

      # The render bridge ships as its own artifact: leafpad's server image
      # downloads just this binary (pinned + checksum-verified), not the CLI.
      - name: Build render bridge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd core
          BINARY_NAME="leafpress-render"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="leafpress-render.exe"
          fi
          go build -ldflags="-s -w" -o $BINARY_NAME ./cmd/leafpress-render

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p dist
          tar -czvf dist/leafpress-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C cli leafpress
          tar -czvf dist/leafpress-render-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C core leafpress-render

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p dist
          (cd cli && zip ../dist/leafpress-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip leafpress.exe)
          (cd core && zip ../dist/leafpress-render-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip leafpress-render.exe)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafpress-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One flat checksums file over every archive, so consumers (the leafpad
      # Dockerfile in particular) can pin a version and verify the download.
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
