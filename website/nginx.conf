server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Cloudflare → VPS → container on :8080. Without these, nginx's
    # automatic directory redirect (e.g. /changelog → /changelog/) builds an
    # absolute Location that includes $server_port=8080.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Serve install script at root URL
    location = /install.sh {
        alias /usr/share/nginx/html/static/install.sh;
    }

    # Only the generated client bundle has a content-addressed filename.
    location ~ "^/static/leafpress/app\.[0-9a-f]{32}\.js$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Styles, Mermaid, fonts, and user assets can change at the same URL.
    # Allow storage, but require validation before a cached response is reused.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "no-cache";
    }
}
